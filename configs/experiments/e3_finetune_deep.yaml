defaults:
  - ../base.yaml

experiment:
  id: E3
  name: e3_finetune_deep
  slug: e3_finetune_deep
  seed: 42
  description: Fine-tune sâu từ block_10_expand, LR nhỏ và theo dõi overfitting.
  valid_for_report_requires_verified_group_split: true

pipeline:
  augmentation:
    enabled: false

training:
  default_threshold: 0.50
  head:
    enabled: true
    max_epochs: 20
    learning_rate: 0.001
  fine_tune:
    enabled: true
    max_epochs: 30
    unfreeze_from: block_10_expand
    require_layer_exists: true
    record_trainable_layer_count: true
    learning_rate: 0.00001
  overfitting_monitor:
    enabled: true
    compare_train_validation_curves: true

model:
  freeze_backbone: false
  freeze_batch_normalization: true

evaluation:
  threshold: 0.50
  test_threshold: 0.50
